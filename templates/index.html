<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>piMonitor_sys_status</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #050505;
            --fg-color: #00ff41;
            --border-color: #008f11;
            --accent-color: #003b00;
        }

        body {
            background-color: var(--bg-color);
            color: var(--fg-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            text-transform: uppercase;
        }

        .credit {
            margin: 0 0 6px;
            color: var(--border-color);
            font-size: 0.85em;
            text-transform: none;
        }

        h1 {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            font-size: 1.5em;
            text-shadow: 0 0 5px var(--fg-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            border: 1px solid var(--border-color);
            background-color: var(--accent-color);
            padding: 15px;
            box-shadow: inset 0 0 10px rgba(0, 255, 65, 0.2);
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: var(--fg-color);
            opacity: 0.5;
        }

        .label {
            font-size: 0.8em;
            color: #00b32c;
            margin-bottom: 5px;
        }

        .value {
            font-size: 1.8em;
            font-weight: bold;
            text-shadow: 0 0 8px var(--fg-color);
        }

        .warning {
            color: #ffaa00;
            text-shadow: 0 0 8px #ffaa00;
        }

        .danger {
            color: #ff0000;
            text-shadow: 0 0 8px #ff0000;
        }

        .chart-container {
            width: 100%;
            height: 300px;
            border: 1px solid var(--border-color);
            background-color: #001100;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        /* Glitch effect on header */
        .glitch {
            position: relative;
            display: inline-block;
        }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
        }
        .glitch::before {
            left: 2px;
            text-shadow: -1px 0 red;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim 2s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px;
            text-shadow: -1px 0 blue;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(20px, 9999px, 85px, 0); }
            20% { clip: rect(60px, 9999px, 15px, 0); }
            40% { clip: rect(10px, 9999px, 45px, 0); }
            60% { clip: rect(80px, 9999px, 90px, 0); }
            80% { clip: rect(40px, 9999px, 25px, 0); }
            100% { clip: rect(90px, 9999px, 55px, 0); }
        }
    </style>
</head>
<body>

    <p class="credit">powered by Stephen Brodigan - build: {{.Build}}</p>
    <h1 class="glitch" data-text="> PIMONITOR_SYS_STATUS_"> > PIMONITOR_SYS_STATUS_</h1>

    <div class="grid">
        <div class="card">
            <div class="label">CPU_TEMP</div>
            <div class="value" id="val-temp">-- °C</div>
        </div>
        <div class="card">
            <div class="label">CPU_FREQ</div>
            <div class="value" id="val-freq">-- MHz</div>
        </div>
        <div class="card">
            <div class="label">ACTIVE_COOLER</div>
            <div class="value" id="val-fan">--</div>
        </div>
        <div class="card">
            <div class="label">MEMORY_USAGE</div>
            <div class="value" id="val-ram">-- / -- MB</div>
        </div>
        <div class="card">
            <div class="label">SYS_LOAD (1m 5m 15m)</div>
            <div class="value" id="val-load">-- -- --</div>
        </div>
    </div>

    <h2>> HISTORICAL_DATA_ [LAST 1 HOUR]</h2>
    <div class="chart-container">
        <canvas id="tempChart"></canvas>
    </div>
    <div class="chart-container">
        <canvas id="ramChart"></canvas>
    </div>

    <script>
        // Chart Configs
        Chart.defaults.color = '#00ff41';
        Chart.defaults.font.family = "'Courier New', Courier, monospace";
        Chart.defaults.borderColor = '#003b00';

        const commonOptions = {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            scales: {
                x: { display: false },
                y: { beginAtZero: true, grid: { color: '#003b00' } }
            },
            plugins: {
                legend: { display: false }
            }
        };

        const tempCtx = document.getElementById('tempChart').getContext('2d');
        const tempChart = new Chart(tempCtx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'CPU Temp (°C)', data: [], borderColor: '#ff3300', backgroundColor: 'rgba(255, 51, 0, 0.2)', borderWidth: 2, fill: true, pointRadius: 0 }] },
            options: { ...commonOptions, scales: { ...commonOptions.scales, y: { suggestedMin: 30, suggestedMax: 85, grid: { color: '#003b00' } } } }
        });

        const ramCtx = document.getElementById('ramChart').getContext('2d');
        const ramChart = new Chart(ramCtx, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'RAM Used (MB)', data: [], borderColor: '#00ff41', backgroundColor: 'rgba(0, 255, 65, 0.2)', borderWidth: 2, fill: true, pointRadius: 0 }] },
            options: commonOptions
        });

        function updateUI(metric) {
            const tempEl = document.getElementById('val-temp');
            tempEl.innerText = metric.cpuTemp.toFixed(1) + " °C";
            if(metric.cpuTemp > 80) tempEl.className = "value danger";
            else if(metric.cpuTemp > 70) tempEl.className = "value warning";
            else tempEl.className = "value";

            document.getElementById('val-freq').innerText = metric.cpuFreq + " MHz";
            
            const fanEl = document.getElementById('val-fan');
            if(metric.fanActive) {
                fanEl.innerText = "RUNNING (" + metric.fanSpeed + ")";
                fanEl.style.color = "#00ff41";
            } else {
                fanEl.innerText = "OFF";
                fanEl.style.color = "#008f11";
            }

            document.getElementById('val-ram').innerText = metric.ramUsed + " / " + metric.ramTotal + " MB";
            document.getElementById('val-load').innerText = metric.load1.toFixed(2) + " " + metric.load5.toFixed(2) + " " + metric.load15.toFixed(2);
        }

        async function fetchHistory() {
            try {
                const res = await fetch('/api/history?hours=1');
                const data = await res.json();
                
                const labels = data.map(m => new Date(m.timestamp * 1000).toLocaleTimeString());
                const temps = data.map(m => m.cpuTemp);
                const rams = data.map(m => m.ramUsed);

                tempChart.data.labels = labels;
                tempChart.data.datasets[0].data = temps;
                tempChart.update();

                ramChart.data.labels = labels;
                ramChart.data.datasets[0].data = rams;
                ramChart.update();

                if (data.length > 0) {
                    updateUI(data[data.length - 1]);
                }
            } catch (err) {
                console.error("Link severed:", err);
            }
        }

        async function fetchLatest() {
            try {
                const res = await fetch('/api/latest');
                const metric = await res.json();
                updateUI(metric);
                
                const timeStr = new Date(metric.timestamp * 1000).toLocaleTimeString();
                
                // Append to charts to make them slide
                tempChart.data.labels.push(timeStr);
                tempChart.data.datasets[0].data.push(metric.cpuTemp);
                if(tempChart.data.labels.length > 100) {
                    tempChart.data.labels.shift();
                    tempChart.data.datasets[0].data.shift();
                }
                tempChart.update();

                ramChart.data.labels.push(timeStr);
                ramChart.data.datasets[0].data.push(metric.ramUsed);
                if(ramChart.data.labels.length > 100) {
                    ramChart.data.labels.shift();
                    ramChart.data.datasets[0].data.shift();
                }
                ramChart.update();

            } catch (err) {
                console.error("Link severed:", err);
            }
        }

        // Initial fetch of last hour, then poll every 5s
        fetchHistory().then(() => {
            setInterval(fetchLatest, 5000);
        });

    </script>
</body>
</html>
